</html><!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metas - TRAGOFF</title>

    <link rel="stylesheet" href="css/tragoff.css">
</head>

<body>

<div class="layout-interno">

    <aside class="menu-lateral">

        <div class="menu-logo">

            <a href="dashboard.html" class="logo">

                <svg viewBox="0 0 50 50" fill="none">
                    <circle cx="25" cy="25" r="17" stroke="#00D4D8" stroke-width="4"/>
                    <line x1="25" y1="5" x2="25" y2="20" stroke="#00D4D8" stroke-width="4" stroke-linecap="round"/>
                    <path d="M25 20H34" stroke="#F2F2F2" stroke-width="4" stroke-linecap="round"/>
                </svg>

                <div class="logo-texto">
                    TRAG<span>OFF</span>
                </div>

            </a>

        </div>

        <nav class="menu-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="registrar.html">
                Registrar
            </a>

            <a href="historico.html">
                Histórico
            </a>

            <a href="metas.html" class="ativo">
                Metas
            </a>

            <a href="perfil.html">
                Perfil
            </a>

            <button type="button" class="menu-sair" onclick="sair()">
                Sair
            </button>

        </nav>

    </aside>


    <main class="conteudo-interno">

        <div class="topo-pagina">

            <h1>Minhas metas</h1>

            <p>
                Acompanhe seu progresso e defina novas metas.
            </p>

        </div>


        <div class="card">

            <h2 class="titulo-card">
                Nova meta
            </h2>

            <form id="formMeta" class="formulario">

                <div class="grade-formulario">

                    <div class="campo">

                        <label for="cigarrosInicial">
                            Cigarros por dia inicial
                        </label>

                        <input
                                type="number"
                                id="cigarrosInicial"
                                min="1"
                                required
                        >

                    </div>


                    <div class="campo">

                        <label for="cigarrosMeta">
                            Cigarros por dia desejado
                        </label>

                        <input
                                type="number"
                                id="cigarrosMeta"
                                min="1"
                                required
                        >

                    </div>


                    <div class="campo">

                        <label for="dataInicio">
                            Data de início
                        </label>

                        <input
                                type="date"
                                id="dataInicio"
                                required
                        >

                    </div>


                    <div class="campo">

                        <label for="dataFim">
                            Data de fim
                        </label>

                        <input
                                type="date"
                                id="dataFim"
                                required
                        >

                    </div>

                </div>


                <div id="mensagemMeta" class="mensagem"></div>


                <div class="acoes-formulario">

                    <button
                            type="submit"
                            class="botao-principal"
                    >
                        Criar meta
                    </button>

                </div>

            </form>

        </div>


        <div class="card" style="margin-top: 20px;">

            <h2 class="titulo-card">
                Metas cadastradas
            </h2>

            <div id="listaMetas">

                <p class="lista-vazia">
                    Carregando...
                </p>

            </div>

        </div>

    </main>

</div>


<script src="js/comum.js"></script>
<script src="js/meta.js"></script>

</body>

</html>
