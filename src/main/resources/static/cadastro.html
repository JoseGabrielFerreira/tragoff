<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - TRAGOFF</title>
    <link rel="stylesheet" href="css/tragoff.css">
    <script src="js/comum.js"></script>
    <script src="js/acesso.js"></script>
</head>
<body>
<div class="centro">
    <a href="index.html"><img src="img/logo.svg" class="logo" alt="TRAGOFF"></a>
    <h1>Criar conta</h1>
    <label for="nome">Nome</label>
    <input id="nome" type="text">
    <label for="email">E-mail</label>
    <input id="email" type="email">
    <label for="senha">Senha (mínimo 4 caracteres)</label>
    <input id="senha" type="password">
    <label for="confirmarSenha">Confirmar senha</label>
    <input id="confirmarSenha" type="password">
    <button onclick="cadastrarUsuario()">Cadastrar</button>
    <p style="margin-top: 20px">Já tem conta? <a href="login.html">Entrar</a></p>
</div>
</body>
</html>
